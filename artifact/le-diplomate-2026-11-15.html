function stripHtml(s){
  const d = document.createElement('div');
  d.innerHTML = s;
  return d.textContent || d.innerText || '';
}

function render(){
  const main = document.getElementById('articles');
  const frag = document.createDocumentFragment();
  EDITION.sections.forEach(s=>{
    const art = document.createElement('article');
    art.className = 'section';
    art.id = s.id;

    const rub = document.createElement('p');
    rub.className = 'rubrique';
    rub.textContent = s.rubrique;
    art.appendChild(rub);

    const h = document.createElement('h2');
    h.className = 'titre';
    h.textContent = s.titre;
    art.appendChild(h);

    if(s.chapeau){
      const ch = document.createElement('p');
      ch.className = 'chapeau';
      ch.textContent = s.chapeau;
      art.appendChild(ch);
    }

    const metaRow = document.createElement('div');
    metaRow.className = 'meta-row';
    metaRow.innerHTML = `<span>${s.duree} min de lecture</span><span class="dot"></span><span>${s.signature}</span>`;
    art.appendChild(metaRow);

    const corpsDiv = document.createElement('div');
    corpsDiv.className = 'corps';
    s.corps.forEach(p=>{
      const para = document.createElement('p');
      para.innerHTML = p;
      corpsDiv.appendChild(para);
    });
    art.appendChild(corpsDiv);

    const ess = document.createElement('div');
    ess.className = 'essentiel';
    const lbl = document.createElement('p');
    lbl.className = 'label';
    lbl.textContent = "L'essentiel";
    ess.appendChild(lbl);
    const ul = document.createElement('ul');
    s.essentiel.forEach(item=>{
      const li = document.createElement('li');
      li.textContent = item;
      ul.appendChild(li);
    });
    ess.appendChild(ul);
    art.appendChild(ess);

    const sig = document.createElement('p');
    sig.className = 'signature' + (s.editorial ? ' editorial' : '');
    sig.textContent = s.signature;
    art.appendChild(sig);

    frag.appendChild(art);
  });
  main.appendChild(frag);
}
render();

// Speech synthesis toggle — never autostarts, reads the full edition top to bottom.
(function(){
  const btn = document.getElementById('listenBtn');
  const label = document.getElementById('listenLabel');
  if(!('speechSynthesis' in window)){
    btn.disabled = true;
    label.textContent = 'Lecture indisponible';
    return;
  }

  function buildUtteranceText(){
    let parts = ['Le Diplomate. Édition du dimanche 15 novembre 2026.'];
    EDITION.sections.forEach(s=>{
      parts.push(s.rubrique + '. ' + s.titre + '.');
      if(s.chapeau) parts.push(s.chapeau);
      s.corps.forEach(p=> parts.push(stripHtml(p)));
    });
    return parts.join(' ');
  }

  let utterance = null;
  let playing = false;

  function setPlaying(v){
    playing = v;
    btn.dataset.playing = String(v);
    btn.setAttribute('aria-pressed', String(v));
    label.textContent = v ? 'Arrêter' : 'Écouter';
  }

  btn.addEventListener('click', ()=>{
    if(playing){
      window.speechSynthesis.cancel();
      setPlaying(false);
      return;
    }
    window.speechSynthesis.cancel();
    utterance = new SpeechSynthesisUtterance(buildUtteranceText());
    utterance.lang = 'fr-FR';
    utterance.rate = 0.98;
    utterance.onend = ()=> setPlaying(false);
    utterance.onerror = ()=> setPlaying(false);
    window.speechSynthesis.speak(utterance);
    setPlaying(true);
  });

  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden && playing){
      window.speechSynthesis.cancel();
      setPlaying(false);
    }
  });
})();
</script>
