const RUBRIC_LABELS = {UNE:"À la une", GEOPOLITIQUE:"Géopolitique", GEOECONOMIE:"Géoéconomie", FRANCE:"France", REGARD_DIPLOMATE:"Le regard du Diplomate"};

const root = document.getElementById("sections");
let lastRubric = null;
EDITION.sections.forEach(s => {
  if (s.rubrique !== lastRubric){
    const r = document.createElement("div");
    r.className = "rubric";
    r.innerHTML = `<span class="rubric-label">${RUBRIC_LABELS[s.rubrique] || s.rubrique}</span><span class="rubric-line"></span>`;
    root.appendChild(r);
    lastRubric = s.rubrique;
  }
  const art = document.createElement("article");
  if (s.editorial) art.classList.add("editorial");
  art.innerHTML = `
    <h2 class="headline">${s.titre}</h2>
    <p class="chapeau">${s.chapeau}</p>
    <div class="byline-row"><span>${s.signature}</span><span class="dur">${s.duree} min de lecture</span></div>
    <div class="corps">${s.corps.map(p => `<p>${p}</p>`).join("")}</div>
    <div class="essentiel">
      <p class="essentiel-label">L'essentiel</p>
      <ul>${s.essentiel.map(e => `<li>${e}</li>`).join("")}</ul>
    </div>`;
  root.appendChild(art);
});

/* speech synthesis — toggle, never autoplays */
const btn = document.getElementById("listenBtn");
const label = document.getElementById("listenLabel");
let utterQueue = [];
let speaking = false;

function buildText(){
  const parts = ["Le Diplomate. Édition du vendredi 20 novembre 2026."];
  EDITION.sections.forEach(s => {
    parts.push(`${RUBRIC_LABELS[s.rubrique] || s.rubrique}. ${s.titre}.`);
    parts.push(s.chapeau);
    parts.push(s.corps.join(" "));
  });
  return parts;
}

function stopSpeech(){
  try{ window.speechSynthesis.cancel(); }catch(e){}
  speaking = false;
  btn.dataset.playing = "false";
  btn.setAttribute("aria-pressed","false");
  label.textContent = "🔊 Écouter l'édition";
}

function startSpeech(){
  if (!("speechSynthesis" in window)){
    label.textContent = "Lecture vocale indisponible";
    return;
  }
  try{ window.speechSynthesis.cancel(); }catch(e){}
  const texts = buildText();
  let i = 0;
  function speakNext(){
    if (i >= texts.length || !speaking){ stopSpeech(); return; }
    const u = new SpeechSynthesisUtterance(texts[i]);
    u.lang = "fr-FR";
    u.rate = 1;
    u.onend = () => { i++; speakNext(); };
    u.onerror = () => { stopSpeech(); };
    window.speechSynthesis.speak(u);
  }
  speaking = true;
  btn.dataset.playing = "true";
  btn.setAttribute("aria-pressed","true");
  label.textContent = "⏸ Arrêter la lecture";
  speakNext();
}

btn.addEventListener("click", () => {
  if (speaking){ stopSpeech(); } else { startSpeech(); }
});
</script>
